services:
  - type: web
    name: smart-garden-api
    runtime: python
    rootDir: django-app
    plan: free
    buildCommand: pip install -r requirement.txt && python manage.py collectstatic --noinput
    startCommand: >
      sh -c "python -u manage.py migrate &&
             python -u manage.py seed --update-existing &&
             exec gunicorn Plant_plotter_settings.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 180"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_CREDENTIALS
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SESSION_COOKIE_SAMESITE
        value: "Lax"
      - key: CSRF_COOKIE_SAMESITE
        value: "Lax"
